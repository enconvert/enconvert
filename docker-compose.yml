# Self-hosting stack for the open-source Enconvert gateway.
# Local defaults only — change every secret before exposing this to a network.
services:
  gateway:
    build: .
    ports:
      - "8010:8010"
    environment:
      ENV: production
      ENVIRONMENT: production
      DATABASE_URL: postgresql://enconvert:enconvert@postgres:5432/enconvert
      JWT_SECRET: change-me-please-use-a-long-random-string
      # S3-compatible storage for conversion outputs (MinIO below).
      DO_SPACES_ENDPOINT: http://minio:9000
      DO_SPACES_KEY: minioadmin
      DO_SPACES_SECRET: minioadmin
      DO_SPACES_BUCKET: enconvert
      DO_SPACES_REGION: us-east-1
      FORWARDED_ALLOW_IPS: "*"
      # Optional: bring your own key to enable the basic LLM-extraction path.
      # ANTHROPIC_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: enconvert
      POSTGRES_PASSWORD: enconvert
      POSTGRES_DB: enconvert
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enconvert"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: create the output bucket, then exit.
  createbucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/enconvert || true;
      exit 0;"

volumes:
  pgdata:
  miniodata:
