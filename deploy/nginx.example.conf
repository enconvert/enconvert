# Example Nginx reverse proxy for a self-hosted Enconvert gateway.
# Replace api.example.com with your domain and wire up TLS (e.g. certbot).

upstream enconvert_gateway {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    server_name api.example.com;

    # Conversions can return large payloads; raise as needed.
    client_max_body_size 100m;

    location / {
        proxy_pass         http://enconvert_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /health {
        proxy_pass http://enconvert_gateway/health;
        access_log off;
    }
}
