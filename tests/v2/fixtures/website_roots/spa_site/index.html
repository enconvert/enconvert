<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>F3 SPA Fixture</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; margin: 40px; color: #16213e; }
  #root { min-height: 400px; }
  .item { border: 1px solid #2e8b57; padding: 10px; margin: 8px 0; }
</style>
</head>
<body>
<noscript><p>F3-SPA-NOSCRIPT-MARKER</p></noscript>
<div id="root"><p>Loading shell...</p></div>
<script>
  // Deterministic client-side render: the converter must execute JS and
  // wait out async content before producing the PDF. No dates, no Math.random.
  function renderApp() {
    var items = ["one", "two", "three", "four"];
    var html = "<h1>F3-SPA-RENDERED-SENTINEL</h1>" +
      "<p>Client-rendered single page application fixture. The initial HTML " +
      "contains only a loading shell; everything below is built by script " +
      "after DOMContentLoaded.</p>";
    for (var i = 0; i < items.length; i++) {
      html += '<div class="item">SPA item ' + items[i] + "</div>";
    }
    document.getElementById("root").innerHTML = html;
    // Second async chunk simulating lazy data arriving after first paint.
    setTimeout(function () {
      var lazy = document.createElement("section");
      lazy.innerHTML = "<h2>F3-SPA-LAZY-SENTINEL</h2>" +
        "<p>Lazy chunk appended 50 ms after the synchronous render. A correct " +
        "render path waits long enough for this block to be in the PDF.</p>";
      document.getElementById("root").appendChild(lazy);
    }, 50);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderApp);
  } else {
    renderApp();
  }
</script>
</body>
</html>
